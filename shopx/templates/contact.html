{% extends "base.html" %}

{% block title %}Contact Us{% endblock %}

{% block content %}
<div class="form-container glass">
    <h1 style="margin-bottom: 1rem; text-align: center;">Get in Touch</h1>
    <p style="text-align: center; color: var(--text-secondary); margin-bottom: 2rem;">Have questions about our latest drop? Reach out below.</p>
    
    <form action="https://formsubmit.co/umarsa8080@gmail.com" method="POST">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="John Doe" required>
        </div>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="john@example.com" required>
        </div>
        <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" placeholder="Question about sizing" required>
        </div>
        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="How can we help?" required></textarea>
        </div>
        <button type="submit" class="cta-button" style="width: 100%; border: none; cursor: pointer;">Send Message</button>
    </form>
</div>
{% endblock %}
