{% extends "base.html" %}

{% block title %}User Profile{% endblock %}

{% block content %}
<div class="form-container glass" style="max-width: 800px;">
    <h1 style="margin-bottom: 2rem;">Your account</h1>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
        <div class="glass" style="padding: 2rem;">
            <h3 style="margin-bottom: 1rem; color: var(--accent);">Account Info</h3>
            <p style="margin-bottom: 0.5rem;"><strong style="color: var(--text-secondary);">Email:</strong> {{ current_user.email }}</p>
            <a href="{{ url_for('logout') }}" style="color: #ff4d4d; font-weight: 600;">Sign Out</a>
        </div>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <h3 style="margin-bottom: 1rem; color: var(--accent);">Shipping Defaults</h3>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" name="phone" id="phone" value="{{ current_user.phone or '' }}" placeholder="+234...">
            </div>
            <div class="form-group">
                <label for="address">Street Address</label>
                <input type="text" name="address" id="address" value="{{ current_user.address or '' }}" placeholder="123 ShopX Way">
            </div>
            <div class="form-group">
                <label for="city">City / State</label>
                <input type="text" name="city" id="city" value="{{ current_user.city or '' }}" placeholder="Lagos">
            </div>
            <button type="submit" class="cta-button" style="width: 100%; border: none; cursor: pointer;">Save Profile</button>
        </form>
    </div>
</div>
{% endblock %}
