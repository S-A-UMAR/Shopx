<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopX | {% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Paystack SDK -->
    <script src="https://js.paystack.co/v1/inline.js"></script>
</head>
<body>
    <nav>
        <div class="logo">SHOPX</div>
        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('products') }}">Shop</a>
            <a href="{{ url_for('about') }}">About</a>
            <a href="{{ url_for('contact') }}">Contact</a>
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('profile') }}">Profile</a>
            {% else %}
                <a href="{{ url_for('login') }}">Login</a>
            {% endif %}
        </div>
        <a href="{{ url_for('cart') }}" class="cart-icon">
            <i class="ph ph-shopping-cart" style="font-size: 1.5rem;"></i>
            <span id="cart-count">0</span>
        </a>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 ShopX. Premium Footwear for Every Journey.</p>
        <div style="margin-top: 1rem; display: flex; justify-content: center; gap: 1rem;">
            <i class="ph ph-instagram-logo"></i>
            <i class="ph ph-twitter-logo"></i>
            <i class="ph ph-facebook-logo"></i>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/cart.js') }}"></script>
</body>
</html>
